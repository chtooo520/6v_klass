<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{

  background:#080c1a;color:#fff;min-height:100vh;overflow-x:hidden;

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;

.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.b1{width:480px;height:480px;background:#6366f1;top:-140px;left:-140px;animation:d1 26s ease-in-out infinite}
.b2{width:420px;height:420px;background:#ec4899;top:18%;right:-160px;animation:d2 30s ease-in-out infinite}
.b3{width:520px;height:520px;background:#06b6d4;bottom:-200px;left:5%;animation:d3 34s ease-in-out infinite}
.b4{width:360px;height:360px;background:#8b5cf6;bottom:5%;right:8%;animation:d1 28s ease-in-out infinite reverse}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.12)}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,80px) scale(1.15)}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-70px) scale(.9)}}

.glass{
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
}

.wrap{max-width:720px;margin:0 auto;padding:14px 16px 0}

.topbar{
  position:sticky;top:10px;z-index:60;
  display:flex;align-items:center;gap:12px;
  padding:10px 10px 10px 20px;margin-bottom:14px;

}
.brand{flex:1;min-width:0}

.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;flex-shrink:0;transition:.3s}
.dot.off{background:#64748b;box-shadow:none}
.dot.busy{background:#f59e0b;box-shadow:0 0 10px #f59e0b;animation:pulse 1s infinite}

.greeting{

  border:1px solid rgba(139,92,246,.3);
}
.greeting-hello{font-size:13px;opacity:.65;font-weight:500;letter-spacing:.3px;margin-bottom:4px}
.greeting-name{

}

}

}
.person-card.starosta.absent{

.person-emoji{font-size:28px;flex-shrink:0;filter:drop-shadow(0 3px 10px rgba(139,92,246,.5))}
.person-info{flex:1;min-width:0}
.person-label{font-size:10.5px;opacity:.55;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.person-name{font-size:15.5px;font-weight:700;margin-top:3px;letter-spacing:-.2px}
.person-status{font-size:13px;margin-top:4px;font-weight:600}
.person-card.teacher .person-status{color:#6ee7b7}
.person-card.starosta .person-status{color:#a5b4fc}
.person-card.absent .person-status{color:#fda4af}

.switch{

  background:rgba(255,255,255,.13);

.switch::after{

  transition:transform .28s cubic-bezier(.34,1.56,.64,1);

.date-card{

.date-label{font-size:13px;opacity:.6;font-weight:600;flex-shrink:0}
.date-input{

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.chip{

.reason-input{

.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s}

.modal-body{position:relative;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;

@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}

.pwd-input{

.rep-starosta{

.rep-count{display:flex;align-items:baseline;gap:9px;margin:22px 0 18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.1)}
.rep-num{font-size:50px;font-weight:800;line-height:1;letter-spacing:-2px;color:#fff}

.rep-row{display:flex;gap:12px;margin-bottom:13px;align-items:flex-start}
.rep-idx{

.rep-footer{margin-top:22px;padding-top:15px;border-top:1px solid rgba(255,255,255,.1);

@media(max-width:480px){
  .wrap{padding:10px 12px 0}
  .card{padding:18px}
  .summary{padding:22px 18px;gap:16px}
  .big-num{font-size:52px;min-width:58px;letter-spacing:-2px}

</style>
</head>

    setStatus("busy");

    listenerRef = db.ref("class_6v/absent");
    listenerRef.on("value", (snap) => {
      const data = snap.val();
      if (!data) { setStatus("on"); return; }
      if (data.date !== todayStr()) return;
      if (data.ts <= state.ts) return;
      state.absent = data.absent || {};
      state.teacherAbsent = !!data.teacherAbsent;
      state.starostaAbsent = !!data.starostaAbsent;
      state.reportDate = data.reportDate || todayStr();
      state.ts = data.ts;
      state.date = data.date;
      saveLocal();
      preserveFocus(renderAll);
      setStatus("on");
    }, (err) => {
      console.warn("Firebase listen error:", err);
      setStatus("off");
    });
  } catch (e) {
    console.error("Firebase init error:", e);
    setStatus("off");
  }
}

/* ---------- LOCAL ---------- */
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.date === todayStr()) {
      state.absent = s.absent || {};
      state.teacherAbsent = !!s.teacherAbsent;
      state.starostaAbsent = !!s.starostaAbsent;
      state.reportDate = s.reportDate || todayStr();
      state.ts = s.ts || 0;
    }
  } catch (e) {}
}
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      date: state.date,
      reportDate: state.reportDate,
      absent: state.absent,
      teacherAbsent: state.teacherAbsent,
      starostaAbsent: state.starostaAbsent,
      ts: state.ts
    }));
  } catch (e) {}
}

/* ---------- SYNC ---------- */
function setStatus(s) {
  const d = document.getElementById("syncDot");
  d.className = "dot" + (s === "off" ? " off" : s === "busy" ? " busy" : "");
}
let pubTimer = null;
function schedulePublish() {
  state.ts = Date.now();
  state.date = todayStr();
  saveLocal();
  setStatus("busy");
  clearTimeout(pubTimer);
  pubTimer = setTimeout(publish, 400);
}
function publish() {
  if (!db) { setStatus("off"); return; }
  db.ref("class_6v/absent").set({
    date: state.date,
    reportDate: state.reportDate,
    absent: state.absent,
    teacherAbsent: state.teacherAbsent,
    starostaAbsent: state.starostaAbsent,
    ts: state.ts
  }).then(() => setStatus("on")).catch((e) => {
    console.error("Publish error:", e);
    setStatus("off");
  });
}

/* ---------- FOCUS ---------- */
function preserveFocus(fn) {
  const el = document.activeElement;
  const key = el && el.dataset ? el.dataset.fk : null;
  const pos = el && el.selectionStart;
  fn();
  if (key) {
    const nx = document.querySelector('[data-fk="' + key + '"]');
    if (nx) { nx.focus(); try { nx.setSelectionRange(pos, pos); } catch (e) {} }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderAll() {
  document.getElementById("brandTitle").textContent = "Отсутствующие · " + CONFIG.className;
  document.getElementById("brandSub").textContent = view === "teacher"
    ? "Панель классного руководителя"
    : "Режим старосты · отмечай отсутствующих";
  document.getElementById("viewBtn").textContent = view === "teacher" ? "Для старосты" : "Готово";

  document.getElementById("app").innerHTML = view === "teacher" ? teacherHTML() : monitorHTML();
  if (view === "monitor") {
    bindStudents();
    bindDatePicker();
    bindPersonCards();
  }
  bindActions();
}

/* ---------- HEADER ---------- */
function greetingHTML() {
  return `
    <div class="glass greeting">
      <div class="greeting-hello">Здравствуйте,</div>
      <div class="greeting-name"><span class="greeting-emoji">🌸</span>${esc(CONFIG.teacherName)}!</div>
    </div>
  `;
}

/* ---------- КАРТОЧКА ЧЕЛОВЕКА ---------- */
function personCardHTML(type) {
  const isTeacher = type === 'teacher';
  const name = isTeacher ? CONFIG.teacherName : CONFIG.starostaName;
  const emoji = isTeacher ? '🌸' : '🎓';
  const label = isTeacher ? 'Классный руководитель' : 'Староста';
  const isAbs = isTeacher ? state.teacherAbsent : state.starostaAbsent;
  const roleClass = isTeacher ? 'teacher' : 'starosta';
  const cardId = isTeacher ? 'teacherCard' : 'starostaCard';

  return `
    <div class="glass person-card ${roleClass} ${isAbs ? 'absent' : ''} editable" id="${cardId}" data-type="${type}">
      <div class="person-emoji">${emoji}</div>
      <div class="person-info">
        <div class="person-label">${label}</div>
        <div class="person-name">${esc(name)}</div>
        <div class="person-status">${isAbs ? '❌ Не будет' : '✅ Будет'}</div>
      </div>
      <div class="switch"></div>
    </div>
  `;
}

/* ---------- DATE ---------- */
function dateCardHTML() {
  return `
    <div class="glass date-card">
      <div class="date-label">📅 Дата отчёта</div>
      <input type="date" class="date-input" id="datePicker" value="${esc(state.reportDate)}">
    </div>
  `;
}

/* ---------- SUMMARY ---------- */
function summaryHTML() {
  const n = Object.keys(state.absent).length;
  const total = students.length;
  return `
    <div class="glass summary">
      <div class="big-num">${n}</div>
      <div>
        <div class="sum-label">${n === 0 ? "все на месте" : n === 1 ? "отсутствует" : "отсутствуют"}</div>
        <div class="sum-sub">из ${total} учеников · ${CONFIG.className} класс</div>
      </div>
    </div>
    <div class="glass card" style="padding:14px 22px">
      <div class="card-sub" style="margin:0">📅 ${esc(formatRu(state.reportDate))}</div>
    </div>
  `;
}

/* ---------- READ-ONLY список ---------- */
function readOnlyListHTML() {
  const list = students.filter(s => state.absent[s.id] !== undefined);
  if (list.length === 0) {
    return `<div class="glass card"><div class="empty">
      <div class="empty-emoji">🎉</div>
      <div class="empty-title">Все на месте</div>
      <div class="empty-sub">Отсутствующих нет</div>
    </div></div>`;
  }
  return `<div class="glass card">
    <div class="card-title" style="margin-bottom:14px">Список отсутствующих</div>
    ${list.map((s, i) => {
      const r = state.absent[s.id] || "";
      return `<div class="view-row" style="animation-delay:${i * 40}ms">
        <div class="avatar">${esc(s.name.trim().charAt(0))}</div>
        <div class="view-info">
          <div class="view-name">${esc(s.name)}</div>
          <div class="view-reason ${r ? '' : 'none'}">${r ? esc(r) : 'причина не указана'}</div>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

/* ---------- EDIT список ---------- */
function editListHTML() {
  const cnt = Object.keys(state.absent).length;
  return `
    <div class="glass card" style="padding:18px 20px 14px">
      <div class="card-title">Отметь отсутствующих</div>
      <div class="card-sub" id="mCount">${cnt} из ${students.length} отмечено</div>
    </div>
    <div class="glass card" style="padding:14px">
      ${students.map(s => {
        const isAbs = state.absent[s.id] !== undefined;
        const reason = isAbs ? (state.absent[s.id] || "") : "";
        return `<div class="stu ${isAbs ? 'absent' : ''}" data-id="${s.id}">
          <div class="stu-main">
            <div class="stu-name">${esc(s.name)}</div>
            <div class="switch"></div>
          </div>
          <div class="stu-reason">
            <div class="chips">
              ${CONFIG.quick.map(q => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}
            </div>
            <input class="reason-input" data-fk="r-${s.id}" placeholder="Причина отсутствия..." value="${esc(reason)}">
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

/* ---------- ACTIONS ---------- */
function actionsHTML(forMonitor) {
  return `
    <div class="actions">
      <button class="btn primary big" id="photoBtn">📸 Сделать фото для отправки</button>
      ${forMonitor ? `<button class="btn danger big" id="resetBtn">Сбросить все отметки</button>` : ''}
    </div>
  `;
}

/* ---------- TEACHER VIEW ---------- */
function teacherHTML() {
  return `
    ${greetingHTML()}
    ${summaryHTML()}
    ${readOnlyListHTML()}
    ${actionsHTML(false)}
  `;
}

/* ---------- MONITOR VIEW ---------- */
function monitorHTML() {
  return `
    ${dateCardHTML()}
    ${personCardHTML('starosta')}
    ${personCardHTML('teacher')}
    ${editListHTML()}
    ${actionsHTML(true)}
  `;
}

/* ---------- LOGIC ---------- */
function updateCount() {
  const el = document.getElementById("mCount");
  if (el) el.textContent = Object.keys(state.absent).length + " из " + students.length + " отмечено";
}

function toggleAbsent(id, row) {
  if (state.absent[id] !== undefined) {
    delete state.absent[id];
    row.classList.remove("absent");
    const inp = row.querySelector(".reason-input");
    if (inp) inp.value = "";
  } else {
    state.absent[id] = "";
    row.classList.add("absent");
  }
  updateCount();
  schedulePublish();
}

function bindStudents() {
  document.querySelectorAll(".stu").forEach(row => {
    const id = row.dataset.id;
    row.querySelector(".stu-main").addEventListener("click", () => toggleAbsent(id, row));
  });

  document.querySelectorAll(".reason-input").forEach(inp => {
    inp.addEventListener("input", () => {
      const id = inp.dataset.fk.slice(2);
      state.absent[id] = inp.value;
      schedulePublish();
    });
  });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", e => {
      e.stopPropagation();
      const row = chip.closest(".stu");
      const id = row.dataset.id;
      const inp = row.querySelector(".reason-input");
      inp.value = chip.dataset.q;
      state.absent[id] = chip.dataset.q;
      schedulePublish();
    });
  });
}

function bindPersonCards() {
  document.querySelectorAll(".person-card.editable").forEach(card => {
    const type = card.dataset.type;
    card.addEventListener("click", () => {
      if (type === 'teacher') {
        state.teacherAbsent = !state.teacherAbsent;
        card.classList.toggle("absent", state.teacherAbsent);
        const st = card.querySelector(".person-status");
        if (st) st.textContent = state.teacherAbsent ? "❌ Не будет" : "✅ Будет";
      } else if (type === 'starosta') {
        state.starostaAbsent = !state.starostaAbsent;
        card.classList.toggle("absent", state.starostaAbsent);
        const st = card.querySelector(".person-status");
        if (st) st.textContent = state.starostaAbsent ? "❌ Не будет" : "✅ Будет";
      }
      schedulePublish();
    });
  });
}

function bindDatePicker() {
  const dp = document.getElementById("datePicker");
  if (!dp) return;
  dp.addEventListener("change", () => {
    state.reportDate = dp.value || todayStr();
    saveLocal();
    schedulePublish();
  });
}

function bindActions() {
  const photoBtn = document.getElementById("photoBtn");
  if (photoBtn) photoBtn.addEventListener("click", openReport);

  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    if (Object.keys(state.absent).length === 0 && !state.teacherAbsent && !state.starostaAbsent) return;
    if (confirm("Сбросить все отметки?")) {
      state.absent = {};
      state.teacherAbsent = false;
      state.starostaAbsent = false;
      renderAll();
      schedulePublish();
    }
  });
}

/* ============================================================
   ФОТО-ОТЧЁТ
   ============================================================ */
function reportHTML() {
  const list = students.filter(s => state.absent[s.id] !== undefined);
  const n = list.length;
  const d = new Date();
  const timeStr = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  const dateDisplay = formatRu(state.reportDate);

  return `
    <div class="rep-title">Отсутствующие</div>
    <div class="rep-class">${esc(CONFIG.className)} класс</div>
    <div class="rep-date">${esc(dateDisplay)}</div>
    ${state.teacherAbsent
      ? `<div class="rep-teacher">🌸 Классный руководитель (${esc(CONFIG.teacherName)}) — <b>не будет</b></div>`
      : ''}
    ${state.starostaAbsent
      ? `<div class="rep-starosta">🎓 Староста (${esc(CONFIG.starostaName)}) — <b>не будет</b></div>`
      : ''}
    <div class="rep-count">
      <span class="rep-num">${n}</span>
      <span class="rep-of">из ${students.length} учеников</span>
    </div>
    ${n === 0
      ? `<div class="rep-empty">Все на месте 🎉</div>`
      : list.map((s, i) => {
          const r = state.absent[s.id] || "";
          return `<div class="rep-row">
            <div class="rep-idx">${i + 1}</div>
            <div class="rep-info">
              <div class="rep-name">${esc(s.name)}</div>
              <div class="rep-reason ${r ? '' : 'none'}">${r ? esc(r) : 'причина не указана'}</div>
            </div>
          </div>`;
        }).join("")
    }
    <div class="rep-footer">Обновлено в ${esc(timeStr)}</div>
  `;
}

function openReport() {
  const modal = document.getElementById("modal");
  const rep = document.getElementById("report");
  rep.innerHTML = reportHTML();
  modal.classList.add("show");
}

async function renderCanvas() {
  const rep = document.getElementById("report");
  return await html2canvas(rep, {
    backgroundColor: null,
    scale: Math.min(3, (window.devicePixelRatio || 1) * 1.8),
    logging: false,
    useCORS: true
  });
}

document.getElementById("dlBtn").addEventListener("click", async () => {
  const btn = document.getElementById("dlBtn");
  btn.disabled = true; btn.textContent = "⏳ Готовим...";
  try {
    const canvas = await renderCanvas();
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Отсутствующие_" + CONFIG.className.replace(/"/g, "") + "_" + state.reportDate + ".png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }, "image/png");
  } catch (e) { alert("Ошибка при создании фото"); }
  btn.disabled = false; btn.textContent = "⬇️ Скачать";
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const btn = document.getElementById("shareBtn");
  btn.disabled = true; btn.textContent = "⏳...";
  try {
    const canvas = await renderCanvas();
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const file = new File([blob], "Отсутствующие.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Отсутствующие " + CONFIG.className });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Отсутствующие_" + CONFIG.className.replace(/"/g, "") + ".png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }
  } catch (e) {}
  btn.disabled = false; btn.textContent = "📤 Отправить";
});

function closeModal() { document.getElementById("modal").classList.remove("show"); }
document.getElementById("closeBtn").addEventListener("click", closeModal);
document.getElementById("modalBd").addEventListener("click", closeModal);

/* ============================================================
   ПАРОЛЬ
   ============================================================ */
const pwdModal = document.getElementById("pwdModal");
const pwdInput = document.getElementById("pwdInput");
const pwdError = document.getElementById("pwdError");

document.getElementById("viewBtn").addEventListener("click", () => {
  if (view === "monitor") {
    view = "teacher";
    isMonitorUnlocked = false;
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderAll();
  } else {
    if (isMonitorUnlocked) {
      view = "monitor";
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderAll();
    } else {
      pwdModal.classList.add("show");
      pwdInput.value = "";
      pwdError.style.display = "none";
      setTimeout(() => pwdInput.focus(), 100);
    }
  }
});

function checkPassword() {
  if (pwdInput.value === CONFIG.password) {
    isMonitorUnlocked = true;
    pwdModal.classList.remove("show");
    view = "monitor";
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderAll();
  } else {
    pwdError.style.display = "block";
    pwdInput.value = "";
    pwdInput.focus();
  }
}

document.getElementById("pwdSubmit").addEventListener("click", checkPassword);
document.getElementById("pwdCancel").addEventListener("click", () => pwdModal.classList.remove("show"));
document.getElementById("pwdModalBd").addEventListener("click", () => pwdModal.classList.remove("show"));
pwdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") checkPassword(); });

/* ---------- VISIBILITY ---------- */
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    if (state.date !== todayStr()) {
      state.date = todayStr();
      state.reportDate = todayStr();
      state.absent = {};
      state.teacherAbsent = false;
      state.starostaAbsent = false;
      state.ts = 0;
      saveLocal();
      renderAll();
    }
  }
});

/* ---------- START ---------- */
loadLocal();
if (state.date !== todayStr()) {
  state.date = todayStr();
  state.reportDate = todayStr();
  state.absent = {};
  state.teacherAbsent = false;
  state.starostaAbsent = false;
  state.ts = 0;
}
renderAll();
initFirebase();
setInterval(() => {
  if (state.date !== todayStr()) {
    state.date = todayStr();
    state.reportDate = todayStr();
    state.absent = {};
    state.teacherAbsent = false;
    state.starostaAbsent = false;
    state.ts = 0;
    saveLocal();
    renderAll();
    if (db) publish();
  }
}, 60000);
</script>
</body>
