<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посещаемость 6 «В»</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1ebdc;--card:#fffdf7;--tx:#2b2519;--mut:#7a6f5a;--ac:#8a5a2b;--bd:#d9ceb4;--red:#b3261e;--ok:#3d7a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 "Times New Roman",Times,"Liberation Serif",serif}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
button,select,input{font:inherit;color:var(--tx)}
select,input[type=text],input[type=password],input[type=date]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:6px 0}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.r{background:var(--red)}
.red{color:var(--red);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>button{flex:none}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.st:last-child{border:0}
.st .n{width:26px;color:var(--mut);font-size:13px}
.st .nm{flex:1}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:26px;transition:.2s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--red)}.sw input:checked+i:after{left:23px}
.rs{width:130px;margin:0;padding:7px 9px;font-size:14px}
.ok{color:var(--ok);font-weight:600}
.warn{background:#fff3cd;color:#5c4400;padding:8px 12px;border-radius:10px;font-size:14px;margin:8px 0}
.tag{display:inline-block;background:var(--red);color:#fff;border-radius:20px;padding:1px 10px;font-size:13px}
.hid{display:none}
button,select,input,textarea{font-family:inherit}
.card{box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(80,60,20,.12);background-image:linear-gradient(transparent 31px,rgba(138,90,43,.07) 32px);background-size:100% 32px}
h1{font-weight:400;font-size:30px;border-bottom:1px solid var(--bd);padding-bottom:6px}h2{font-weight:700}
.nt{width:calc(100% - 36px);margin:2px 0 0 36px;padding:7px 10px;font-size:15px}
.st{flex-wrap:wrap}textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:6px 0;resize:vertical;min-height:72px}
#ov{position:fixed;inset:0;background:rgba(30,20,5,.8);z-index:9;display:none;overflow:auto;padding:16px;text-align:center;color:#fff}
#ov img{max-width:100%;border-radius:6px;margin:10px 0}

.sw.l input:checked+i{background:var(--ac)}.sw small{position:absolute;top:-13px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.st{margin-top:6px}.sub{display:flex;gap:6px;width:100%;margin-left:36px;width:calc(100% - 36px)}.sub select{width:150px;margin:0;padding:7px;font-size:15px}.sub .nt{flex:1;margin:0;width:auto}
.bg{background:var(--red);color:#fff;border-radius:20px;padding:0 8px;font-size:13px;margin-left:4px}
.ann{background:#fff6d6;border:1px solid #e3d08a;border-radius:10px;padding:10px 14px;margin:10px 0}.bd{background:#ffe9ef;border:1px solid #efb3c4;border-radius:10px;padding:10px 14px;margin:10px 0}
.good{text-align:center;font-size:24px;color:var(--ok);padding:18px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--bd);padding:5px 4px;text-align:left}
.lnk{cursor:pointer;color:var(--ac);text-decoration:underline}.b2{display:flex;gap:8px;flex-wrap:wrap}.b2 button{flex:1}

#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg);z-index:6}
#tg{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:8px 14px;display:flex}
#bt{font-weight:400;font-size:19px}
.w{padding-top:68px}
#sb{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--card);border-right:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 70px) 12px 16px;transform:translateX(-100%);transition:transform .22s;z-index:8;display:flex;flex-direction:column;gap:4px;box-shadow:4px 0 18px rgba(60,40,10,.15)}
#sb.open{transform:none}
.sbt{font-size:22px;padding:0 10px 12px;border-bottom:1px solid var(--bd);margin-bottom:8px}
.sbf{margin-top:auto;color:var(--mut);font-size:13px;padding:0 10px}
.ni{display:flex;align-items:center;gap:12px;background:transparent;color:var(--tx);text-align:left;font-weight:400;font-size:18px;padding:12px 12px;border-radius:12px}
.ni.act{background:var(--bg);font-weight:700}
#bk{display:none;position:fixed;inset:0;background:rgba(30,20,5,.45);z-index:7}#bk.on{display:block}
@media(min-width:900px){#bk.on{display:none}body.sbo .w{max-width:none;padding-left:292px;padding-right:32px}body.sbo .w>*{max-width:640px}body.sbo #bar{left:260px}#sb{z-index:7;box-shadow:none}}
.greet{font-size:24px;font-style:italic;color:var(--ac);margin:4px 0 2px}
#dbs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);font-size:15px;color:var(--mut)}
#dbs i{width:11px;height:11px;border-radius:50%;background:#d9a400;flex:none}
#dbs.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(61,122,74,.2)}#dbs.ok{color:var(--ok)}
#dbs.bad i{background:var(--red)}#dbs.bad{color:var(--red)}
.w{padding-bottom:64px}@media(min-width:900px){body.sbo #dbs{left:260px}}
</style></head><body><div id="bar"><button id="tg" onclick="tsb()" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><b id="bt"></b></div><div id="bk" onclick="tsb()"></div><aside id="sb"></aside><div class="w" id="app"></div><div id="dbs"><i></i><span></span></div><div id="ov" onclick="this.style.display='none'"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const PASS="2141";
const DEF=["Алиев Саид","Аминев Тимур","Ватагин Кирилл","Воеводина Дарья","Джумаев Одилжон","Дмитриева Ксения","Дружинин Александр","Едиев Султан","Канахин Илья","Канахин Кирилл","Комаров Светослав","Королев Матвей","Кривощёкова Дарья","Кузнецов Тимофей","Лобова Александра","Мазнова Валентина","Марин Никита","Марин Фёдор","Нестеренко Алевтина","Ройгас Тимофей","Ройгас Ермолай","Романова Анастасия","Русанок Василий","Сержантова Нелли","Сисюкина Анна","Смирнов Антон","Строева Алёна","Фатейчев Тимофей","Фатейчева Василиса","Шахтарина Алиса","Шведов Святослав","Шевелёв Михаил","Щербин Вадим"].map((n,i)=>({id:"s"+(i+1),name:n}));
const REASONS=["Болезнь","Семейные обстоятельства","Врач","Соревнования/кружок","Другое"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const today=()=>ymd(new Date());
const fd=d=>d.split("-").reverse().join(".");
let S={view:"main",students:DEF,all:{},date:today(),month:today().slice(0,7),db:null,local:false,msg:"",admin:false,teacher:false,set:{ann:"",dl:"08:30",dlOn:true,bd:[],snd:false},lastP:-1};
let unsub=null;
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const FBC={apiKey:"AIzaSyA1nrHwtnahLaU6FEINNIKM03QYwKhThYo",authDomain:"tusa-pay.firebaseapp.com",databaseURL:"https://tusa-pay-default-rtdb.firebaseio.com",projectId:"tusa-pay",storageBucket:"tusa-pay.firebasestorage.app",messagingSenderId:"308586374263",appId:"1:308586374263:web:addba1e4ab09b54fd59272"};
let FB=null,subRef=null;
function dbs(){const e=$("#dbs");if(!e)return;let c,t;
  if(!FB){c="bad";t="Firebase не загружен — данные только на этом устройстве"}
  else if(S.err){c="bad";t="Нет доступа к базе — проверьте правила Realtime Database"}
  else if(S.net===1){c="ok";t="База данных доступна"}
  else if(S.net===0){c="bad";t="Нет связи с базой данных"}
  else{c="";t="Подключение к базе…"}
  e.className=c;e.lastChild.textContent=t}
try{firebase.initializeApp(FBC);FB=firebase.database()}catch(e){FB=null}
const R="class6v/";
const er=e=>{S.err=1;dbs();if(!window._er){window._er=1;alert("Нет доступа к базе: "+e.message+"\nПроверьте правила Realtime Database (см. инструкцию).")}};
async function init(){
  S.db=FB;S.local=!FB;dbs();
  if(FB){
    FB.ref(".info/connected").on("value",x=>{S.net=x.val()?1:0;dbs()});
    FB.ref(R+"students/list").on("value",x=>{const v=x.val();if(v)S.students=Array.isArray(v)?v.filter(Boolean):Object.values(v);render(1)},er);
    FB.ref(R+"settings").on("value",x=>{const v=x.val();if(v){Object.assign(S.set,v)}S.set.bd=Object.values(S.set.bd||{});render(1)},er);
  }else{S.students=lsGet("students",DEF);S.set=Object.assign(S.set,lsGet("settings",{}));S.all=lsGet("absall",{})}
  sub();render();
}
function sub(){
  if(subRef){subRef.off();subRef=null}
  if(!FB)return;const m=S.month;
  subRef=FB.ref(R+"absent").orderByKey().startAt(m+"-01").endAt(m+"-31_\uf8ff");
  subRef.on("value",q=>{S.all={};q.forEach(c=>{S.all[c.key]=c.val()});const n=pend().length;
    if(S.lastP>=0&&n>S.lastP&&(S.admin||S.teacher)&&S.set.snd)beep();S.lastP=n;S.err=0;dbs();render(1)},er);
}
const inMonth=()=>Object.values(S.all).filter(x=>x.date.slice(0,7)===S.month);
const dayE=()=>Object.values(S.all).filter(x=>x.date===S.date);
const pend=()=>inMonth().filter(x=>x.status==="pending");
const okE=()=>dayE().filter(x=>x.status!=="pending");
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
async function put(sid,date,o){
  const k=date+"_"+sid;S.all[k]=Object.assign({sid,date},o);
  if(FB){try{await FB.ref(R+"absent/"+k).set(S.all[k])}catch(e){er(e);delete S.all[k]}}else lsSet("absall",S.all);
}
async function del(sid,date){
  const k=date+"_"+sid;delete S.all[k];
  if(FB){try{await FB.ref(R+"absent/"+k).remove()}catch(e){er(e)}}else lsSet("absall",S.all);
}
async function saveSt(){if(FB){try{await FB.ref(R+"students/list").set(S.students)}catch(e){er(e)}}else lsSet("students",S.students)}
async function saveSet(){if(FB){try{await FB.ref(R+"settings").set(S.set)}catch(e){er(e)}}else lsSet("settings",S.set)}
const sname=id=>(S.students.find(s=>s.id===id)||{name:"?"}).name;
const note=e=>e.reason.includes(": ")?e.reason.slice(e.reason.indexOf(": ")+2):"";
const cat=e=>e.reason.split(": ")[0];

function go(v){S.view=v;S.msg="";if(innerWidth<900)S.sb=false;render()}
const NAV=[["main","🏠","Главная"],["admin","📝","Староста"],["teacher","👩‍🏫","Учитель"],["hist","📊","История"]];
function tsb(){S.sb=!S.sb;rsb()}
function rsb(){
  if(S.sb===undefined)S.sb=innerWidth>=900;
  const n=pend().length;
  $("#sb").className=S.sb?"open":"";$("#bk").className=S.sb?"on":"";document.body.classList.toggle("sbo",!!S.sb);
  $("#sb").innerHTML='<div class="sbt">6 «В» класс</div>'+NAV.map(([k,ic,t])=>`<button class="ni ${S.view===k?"act":""}" onclick="go('${k}')"><span>${ic}</span>${t}${k==="admin"&&n&&(S.admin||S.teacher)?`<span class="bg">${n}</span>`:""}</button>`).join("")+'<div class="sbf">Посещаемость</div>';
  $("#bt").textContent=(NAV.find(x=>x[0]===S.view)||[])[2]||"";
}
function head(t){return `<h1>${t}</h1><div class="mut">6 «В» класс</div>${S.local?'<div class="warn">Firebase недоступен — данные хранятся только на этом устройстве.</div>':''}<div style="height:10px"></div>`}
function dateBox(){return `<div class="card"><div class="mut">Число</div><div class="row"><button class="g" onclick="stepD(-1)">◀</button><input type="date" value="${S.date}" onchange="setDate(this.value)"><button class="g" onclick="stepD(1)">▶</button></div>
<div class="row" style="margin-top:6px"><input type="number" min="1" max="31" placeholder="или введите число месяца" onchange="dayNum(this.value)"><button class="g" onclick="setDate(today())">Сегодня</button></div><div class="mut">Выбрано: <b>${fd(S.date)}</b></div></div>`}
function stepD(n){const d=new Date(S.date+"T00:00:00");d.setDate(d.getDate()+n);setDate(ymd(d))}
function dayNum(v){v=+v;if(v<1||v>31)return;const [Y,M]=S.date.split("-").map(Number);const d=new Date(Y,M-1,v);if(d.getMonth()!==M-1){alert("В этом месяце нет такого числа");return}setDate(ymd(d))}
function setDate(v){S.date=v||today();const m=S.date.slice(0,7);if(m!==S.month){S.month=m;S.all={};sub()}render()}
function setMonth(v){if(!v)return;S.month=v;S.all={};sub();render()}
const rsel=id=>`<select id="${id}">${REASONS.map(r=>`<option>${r}</option>`).join("")}</select>`;
function login(){const p=$("#pw").value;if(p===PASS){S[S.view==="teacher"?"teacher":S.view==="admin"?"admin":"teacher"]=true;S.msg=""}else S.msg="Неверный пароль";render()}
function loginBox(t){return head(t)+`<div class="card"><input type="password" id="pw" placeholder="Пароль" inputmode="numeric" onkeydown="if(event.key==='Enter')login()"><button onclick="login()" style="width:100%">Войти</button><p class="red">${esc(S.msg)}</p></div>`}

function render(keep){
  const a=document.activeElement;if(keep&&a&&$("#app").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  const L=[...S.students];let h="";const v=S.view;
  if(v==="main"){
    const t=today(),now=new Date(),[hh,mm]=(S.set.dl||"08:30").split(":");
    const closed=S.set.dlOn&&(now.getHours()*60+now.getMinutes()>=+hh*60+ +mm);
    const bds=(S.set.bd||[]).filter(b=>b.md===t.slice(5));
    h=head("Сообщить об отсутствии")+(S.set.ann?`<div class="ann">📢 ${esc(S.set.ann)}</div>`:"")+(bds.length?`<div class="bd">🎂 Сегодня день рождения: <b>${bds.map(b=>esc(sname(b.id))).join(", ")}</b>!</div>`:"")+
    (closed?`<div class="card"><h2>Приём закрыт</h2>Форма работала до ${S.set.dl}. Сообщите старосте лично.</div>`:
    `<div class="card"><h2>Я не приду</h2><div class="mut">Сегодня: ${fd(t)}</div>
    <select id="who"><option value="">— выберите свою фамилию —</option>${L.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
    ${rsel("why")}<textarea id="oth" placeholder="Напишите свою причину или уточнение (необязательно)"></textarea>
    <div class="mut">Если болеете несколько дней — «по» (необязательно):</div><input type="date" id="to" min="${t}">
    <p class="red">Отправляем только за себя! За других отправлять нельзя.</p>
    <button onclick="sendMe()" style="width:100%">Отправить</button><p id="msg" class="ok">${esc(S.msg)}</p></div>`);
  }else if(v==="admin"||v==="teacher"){
    const T=v==="teacher";if(!(T?S.teacher:S.admin))h=loginBox(T?"Вход для классного руководителя":"Вход для старосты");else{
      const E={};dayE().forEach(e=>E[e.sid]=e);const cnt=dayE().filter(e=>e.type!=="late").length;const P=pend();
      h=head(T?"Классный руководитель":"Панель старосты")+(T?'<div class="greet">Здравствуйте, Марина Владимировна!</div>':"")+dateBox()+
      (P.length?`<div class="card"><h2>Новые сообщения: ${P.length}</h2>${P.map(e=>`<div class="st"><span class="nm">${esc(sname(e.sid))}<br><span class="mut">${fd(e.date)} · ${esc(e.reason)}</span></span><button onclick="acc('${e.sid}','${e.date}')">✓</button> <button class="r" onclick="rej('${e.sid}','${e.date}')">✕</button></div>`).join("")}</div>`:"")+
      `<div class="card"><h2>Отсутствуют: ${cnt}</h2><div class="mut">Правый тумблер — «нет», левый — «опоздал»</div>
      ${L.map((s,i)=>{const e=E[s.id],late=e&&e.type==="late",ab=e&&!late;return `<div class="st"><span class="n">${i+1}</span><span class="nm">${esc(s.name)}${e&&e.status==="pending"?" ⏳":""}</span>
      <label class="sw l"><small>опоздал</small><input type="checkbox" ${late?"checked":""} onchange="tg('${s.id}',this.checked,'late')"><i></i></label>
      <label class="sw"><small>нет</small><input type="checkbox" ${ab?"checked":""} onchange="tg('${s.id}',this.checked,'abs')"><i></i></label>
      ${e?`<div class="sub">${late?"":`<select onchange="rc('${s.id}',this.value)">${REASONS.map(r=>`<option ${cat(e)===r?"selected":""}>${r}</option>`).join("")}${REASONS.includes(cat(e))?"":`<option selected>${esc(cat(e))}</option>`}</select>`}<input type="text" class="nt" value="${esc(note(e))}" placeholder="${late?"на сколько минут?":"своя причина / заметка…"}" onchange="nc('${s.id}',this.value)"></div>`:""}</div>`}).join("")}</div>
      <div class="card"><h2>Отправка в чат</h2><div class="b2"><button onclick="exportPng()">📷 Картинка</button><button class="g" onclick="copyTxt()">📋 Текст</button></div></div>
      <div class="card"><h2>Настройки</h2>
      <div class="mut">Объявление на главной</div><textarea onchange="S.set.ann=this.value;saveSet()" placeholder="Например: завтра форма">${esc(S.set.ann||"")}</textarea>
      <label><input type="checkbox" ${S.set.dlOn?"checked":""} onchange="S.set.dlOn=this.checked;saveSet()"> Закрывать приём после </label><input type="time" value="${S.set.dl}" style="width:auto" onchange="S.set.dl=this.value;saveSet()"><br>
      <label><input type="checkbox" ${S.set.snd?"checked":""} onchange="S.set.snd=this.checked;saveSet()"> Звук при новом сообщении</label>
      <div class="mut" style="margin-top:10px">Дни рождения</div><div class="row"><select id="bn">${L.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select><input type="date" id="bdt"><button onclick="addBd()">+</button></div>
      ${(S.set.bd||[]).map((b,i)=>`<div class="st"><span class="nm">${esc(sname(b.id))} — ${b.md.split("-").reverse().join(".")}</span><button class="r" style="padding:4px 10px" onclick="S.set.bd.splice(${i},1);saveSet().then(render)">✕</button></div>`).join("")}</div>
      <div class="card"><h2>Добавить ученика</h2><div class="row"><input type="text" id="nn" placeholder="Фамилия Имя"><button onclick="addSt()">Добавить</button></div>
      <details style="margin-top:10px"><summary class="mut">Удалить ученика</summary>${L.map(s=>`<div class="st"><span class="nm">${esc(s.name)}</span><button class="r" style="padding:4px 10px" onclick="delSt('${s.id}')">✕</button></div>`).join("")}</details></div>`;
    }
  }else{
    if(!S.admin&&!S.teacher)h=loginBox("История");else{
      const dates={};inMonth().filter(e=>e.status!=="pending").forEach(e=>{(dates[e.date]=dates[e.date]||{a:0,l:0})[e.type==="late"?"l":"a"]++});
      const st={};L.forEach(s=>st[s.id]={a:0,l:0,r:{}});let tot=0;
      inMonth().filter(e=>e.status!=="pending"&&st[e.sid]).forEach(e=>{const q=st[e.sid];if(e.type==="late")q.l++;else{q.a++;tot++;q.r[cat(e)]=(q.r[cat(e)]||0)+1}});
      const [Y,M]=S.month.split("-").map(Number),end=Math.min(new Date(Y,M,0).getDate(),(S.month===today().slice(0,7)?new Date().getDate():31));let wd=0;for(let d=1;d<=end;d++){const w=new Date(Y,M-1,d).getDay();if(w&&w<6)wd++}
      const pct=wd?Math.max(0,Math.round(100*(1-tot/(wd*L.length)))):100;
      h=head("История и сводка")+`<div class="card"><div class="mut">Месяц</div><input type="month" value="${S.month}" onchange="setMonth(this.value)">
      <h2>Посещаемость класса: ${pct}%</h2><div class="mut">примерно, по ${wd} учебным дням (пн–пт)</div></div>
      <div class="card"><h2>По дням</h2>${Object.keys(dates).sort().reverse().map(d=>`<div class="st"><span class="nm lnk" onclick="S.date='${d}';go('${S.admin?"admin":"teacher"}')">${fd(d)}</span><span class="mut">нет: ${dates[d].a}${dates[d].l?" · опозд.: "+dates[d].l:""}</span></div>`).join("")||'<div class="mut">В этом месяце записей нет</div>'}</div>
      <div class="card"><h2>Сводка по ученикам</h2><div style="overflow-x:auto"><table><tr><th>Ученик</th><th>Дн.</th><th>Опозд.</th><th>Причины</th></tr>${L.filter(s=>st[s.id].a||st[s.id].l).map(s=>`<tr><td>${esc(s.name)}</td><td>${st[s.id].a}</td><td>${st[s.id].l}</td><td>${Object.entries(st[s.id].r).map(([k,n])=>esc(k)+" "+n).join(", ")}</td></tr>`).join("")}</table></div>
      <button style="width:100%;margin-top:10px" onclick="csv()">⬇ Скачать таблицу (Excel)</button></div>`;
    }
  }
  $("#app").innerHTML=h;rsb();
}
async function sendMe(){
  const id=$("#who").value,m=$("#msg");if(!id){m.className="red";m.textContent="Выберите фамилию";return}
  let r=$("#why").value,o=$("#oth").value.trim();if(o)r+=": "+o;
  const to=$("#to").value,d=new Date(),end=to?new Date(to+"T00:00:00"):new Date();let n=0;
  for(let i=0;i<14&&ymd(d)<=ymd(end);i++){const w=d.getDay();if(i===0||(w&&w<6)){await put(id,ymd(d),{reason:r,by:"student",type:"abs",status:"pending"});n++}d.setDate(d.getDate()+1)}
  S.msg="Отправлено ✓ ("+n+" дн.) Староста подтвердит сообщение.";render();
}
function tg(id,on,type){if(on)put(id,S.date,{reason:type==="late"?"Опоздал":"Болезнь",by:"admin",type,status:"ok"}).then(()=>render());else del(id,S.date).then(()=>render())}
function acc(id,d){const e=S.all[d+"_"+id];put(id,d,Object.assign({},e,{status:"ok"})).then(()=>render())}
function rej(id,d){del(id,d).then(()=>render())}
function rc(id,r){const e=dayE().find(x=>x.sid===id);if(e){const n=note(e);put(id,S.date,Object.assign({},e,{reason:r+(n?": "+n:"")}))}}
function nc(id,v){const e=dayE().find(x=>x.sid===id);if(e){v=v.trim();put(id,S.date,Object.assign({},e,{reason:cat(e)+(v?": "+v:"")}))}}
async function addSt(){const v=$("#nn").value.trim();if(!v)return;S.students=[...S.students,{id:"s"+Date.now(),name:v}].sort((a,b)=>a.name.localeCompare(b.name,"ru"));await saveSt();render()}
async function delSt(id){if(!confirm("Удалить: "+sname(id)+"?"))return;S.students=S.students.filter(x=>x.id!==id);await saveSt();render()}
function addBd(){const d=$("#bdt").value;if(!d)return;(S.set.bd=S.set.bd||[]).push({id:$("#bn").value,md:d.slice(5)});saveSet().then(render)}
function lines(){const e=[...okE()].sort((x,y)=>sname(x.sid).localeCompare(sname(y.sid),"ru"));return e.map((x,i)=>(i+1)+". "+sname(x.sid)+" — "+(x.type==="late"?"":"")+x.reason)}
async function copyTxt(){const t="Отсутствуют 6 «В», "+fd(S.date)+" (нет: "+okE().filter(e=>e.type!=="late").length+" из "+S.students.length+")\n"+(lines().join("\n")||"Все на месте");
  try{await navigator.clipboard.writeText(t);alert("Скопировано! Вставьте в чат.")}catch(e){prompt("Скопируйте текст:",t)}}
async function csv(){
  const m=inMonth().filter(e=>e.status!=="pending"),rows=[["Ученик","Дней отсутствия","Опозданий","Причины"]];
  S.students.forEach(s=>{const x=m.filter(e=>e.sid===s.id),a=x.filter(e=>e.type!=="late");rows.push([s.name,a.length,x.length-a.length,[...new Set(a.map(cat))].join("; ")])});
  const t="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\n"),f="absence_"+S.month+".csv";
  {const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));l.download=f;l.click();return}
  try{await navigator.clipboard.writeText(t);alert("Таблица скопирована — вставьте в Excel")}catch(e){prompt("Скопируйте:",t)}
}
function wrap(c,t,w){const o=[];let l="";for(const wd of t.split(" ")){const x=l?l+" "+wd:wd;if(c.measureText(x).width>w&&l){o.push(l);l=wd}else l=x}o.push(l);return o}
async function exportPng(){
  const W=985,P=70,F='"Times New Roman",Times,"Liberation Serif",serif',TX=W-173-P;
  const e=[...okE()].sort((x,y)=>sname(x.sid).localeCompare(sname(y.sid),"ru"));
  const m=document.createElement("canvas").getContext("2d");m.font="38px "+F;
  const items=e.map(x=>({n:sname(x.sid),r:wrap(m,x.reason,TX)}));
  const rh=it=>70+it.r.length*50+30;
  const n=e.filter(x=>x.type!=="late").length,late=e.length-n;
  const H=Math.max(900,560+items.reduce((a,it)=>a+rh(it),0)+(items.length?0:120)+190);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  x.fillStyle="#f1ebdc";x.fillRect(0,0,W,H);x.fillStyle="#fffdf7";x.strokeStyle="#d9ceb4";x.lineWidth=3;x.beginPath();x.roundRect(14,14,W-28,H-28,24);x.fill();x.stroke();
  x.fillStyle="#2b2519";x.font="bold 68px "+F;x.fillText("Отсутствующие",P,135);
  x.fillStyle="#8a5a2b";x.font="bold 38px "+F;x.fillText('6"В" КЛАСС',P,206);
  let ds=new Date(S.date+"T00:00:00").toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});ds=ds.charAt(0).toUpperCase()+ds.slice(1);
  x.fillStyle="#7a6f5a";x.font="36px "+F;x.fillText(ds,P,258);
  x.fillStyle="#2b2519";x.font="bold 150px "+F;x.fillText(String(n),P,435);
  const nw=x.measureText(String(n)).width;x.fillStyle="#7a6f5a";x.font="44px "+F;x.fillText("из "+S.students.length+" учеников",P+nw+26,430);
  if(late){x.font="32px "+F;x.fillText("+ опоздали: "+late,P,480)}
  x.fillStyle="#d9ceb4";x.fillRect(P,512,W-2*P,2);
  let y=550;
  if(!items.length){x.fillStyle="#3d7a4a";x.font="bold 52px "+F;x.fillText("Все на месте ✓",P,y+90)}
  items.forEach((it,i)=>{
    x.fillStyle="#f6dedb";x.beginPath();x.roundRect(P,y+2,70,70,18);x.fill();
    x.fillStyle="#b3261e";x.font="bold 34px "+F;x.textAlign="center";x.fillText(String(i+1),P+35,y+50);x.textAlign="left";
    x.fillStyle="#2b2519";x.font="bold 46px "+F;x.fillText(it.n,173,y+48);
    x.fillStyle="#b3261e";x.font="38px "+F;it.r.forEach((l,j)=>x.fillText(l,173,y+104+j*50));
    y+=rh(it);
  });
  x.fillStyle="#d9ceb4";x.fillRect(P,H-150,W-2*P,2);
  const t=new Date();x.fillStyle="#7a6f5a";x.font="34px "+F;x.textAlign="center";x.fillText("Обновлено в "+p2(t.getHours())+":"+p2(t.getMinutes()),W/2,H-80);x.textAlign="left";
  const blob=await new Promise(r=>cv.toBlob(r,"image/png")),name="absent_"+S.date+".png";
  try{const f=new File([blob],name,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(er){if(er&&er.name==="AbortError")return}
  const o=$("#ov");const u=cv.toDataURL("image/png");o.innerHTML='<a href="'+u+'" download="'+name+'" style="color:#fff;font-size:22px" onclick="event.stopPropagation()">⬇ Скачать</a><div>или удерживайте картинку, чтобы сохранить</div><img src="'+u+'">';o.style.display="block";
}
init();
</script></body></html>
